<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Timechunk</title>
<style>
:root{--font:-apple-system,"Segoe UI",Roboto,Verdana,sans-serif;--bg:#ECEFF3;--panel:#fff;--canvas:#fff;--ink:#171C26;--mute:#5E6878;--line:#D8DDE5;--accent:#4F7CFF;--accent-ink:#fff;--hatch:#E3E7ED;--now:var(--accent);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--canvas:#000;--panel:#0B0B0C;--ink:#ECEEF2;--mute:#8F97A5;--line:#222428;--hatch:#17181B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--canvas:#000;--panel:#0B0B0C;--ink:#ECEEF2;--mute:#8F97A5;--line:#222428;--hatch:#17181B;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;height:100%;display:grid;grid-template-columns:320px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);background:var(--canvas);color:var(--ink);font:15px/1.45 var(--font);overflow:hidden}
button,input,textarea{font-family:inherit}
.side{grid-column:1;grid-row:2;min-height:0;overflow-y:auto;background:var(--panel);border-right:1px solid var(--line);padding:18px 16px}
.side section{padding-bottom:18px;margin-bottom:18px;border-bottom:1px solid var(--line)}
.side section:last-child{border:0;margin:0}
h2{font-size:15px;margin:0 0 12px;font-weight:600}
.right{display:contents}
.top{grid-column:1/-1;grid-row:1;display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
.top h1{font-size:20px;font-weight:700;letter-spacing:-.02em;margin:0}
.top nav{display:flex;gap:8px}
.main{grid-column:2;grid-row:2;min-height:0;overflow:auto;padding:0 24px 40px}
.pop{position:fixed;right:12px;top:calc(56px + env(safe-area-inset-top,0px));z-index:40;max-height:calc(100vh - 80px);overflow:auto;width:min(330px,calc(100vw - 24px));background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 10px 34px rgba(0,0,0,.35)}
.pop[hidden]{display:none}
.pop h3{font-size:13px;font-weight:600;margin:14px 0 8px}.pop h3:first-of-type{margin-top:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
label{display:block;font-size:13px;color:var(--mute)}
input[type=time],input[type=date],input[type=number],input[type=text]{width:100%;margin-top:4px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dur{display:flex;align-items:center;gap:3px;margin-top:4px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 12px;color:var(--mute);flex:1}
.dur input[type=number]{width:3.4ch;margin:0;padding:8px 0;border:0;border-radius:0;background:none;text-align:right;-moz-appearance:textfield;appearance:textfield}
.dur input::-webkit-inner-spin-button{display:none}
.dur:focus-within{outline:2px solid var(--accent)}
.dur input:focus-visible{outline:0}
.warn{margin:10px 0 0;padding:8px 10px;border-radius:8px;background:color-mix(in srgb,#E5586E 22%,var(--panel));font-size:13px}
.sw{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px;align-items:center}
.sw button{width:24px;height:24px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);background:var(--c);cursor:pointer;padding:0}
.sw button[aria-pressed=true]{box-shadow:0 0 0 2px var(--ink)}
.sw input[type=color]{width:30px;height:26px;padding:0;border:0;background:none;cursor:pointer}
.todo{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.todo span{flex:1;overflow-wrap:anywhere}
.todo.done span{text-decoration:line-through;color:var(--mute)}
.todo input{accent-color:var(--accent)}
.x{border:0;background:none;color:var(--mute);cursor:pointer;font-size:18px;line-height:1}
.row{display:flex;gap:8px;margin-top:10px;align-items:center}
.row input{margin:0}
.btn{padding:7px 14px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.alt{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.alt[aria-pressed=true],.btn.alt[aria-expanded=true]{border-color:var(--ink)}
.btn[hidden]{display:none}
.seg{display:flex;gap:6px}.seg .btn{flex:1}
.muted{color:var(--mute);font-size:13px}
.hdr{position:sticky;top:0;z-index:10;background:var(--canvas);padding:18px 0 12px;display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px;gap:8px;flex-wrap:wrap}
.hdr h2{margin:0;font-size:22px;font-weight:600}
.cal{position:relative;margin-left:64px}
.hr{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.hr b,.hf b{position:absolute;left:-64px;top:-9px;width:54px;text-align:right;font-weight:600;font-size:12px;color:var(--ink)}
.hf{position:absolute;left:0;right:0;border-top:1px dashed var(--line);opacity:.6}
.hf b{font-weight:400;color:var(--mute);font-size:11px}
.zoom{position:fixed;right:24px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:25;display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:4px 6px;box-shadow:0 6px 24px rgba(0,0,0,.2)}.zoom .btn{padding:2px 11px;font-size:17px;line-height:1.2}.zoom span{min-width:46px;text-align:center;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums;cursor:pointer}
.ic{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);cursor:pointer;padding:0;flex:none}
.ic[hidden]{display:none}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.sh h2{margin:0}
.tl{display:flex;align-items:center;gap:10px}
body.col{grid-template-columns:minmax(0,1fr)}body.col .side{display:none}body.col .main{grid-column:1}
#tmrsec.mini{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:25;display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 12px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#tmrsec.mini h2{display:none}
#tmrsec.mini .tdisp{font-size:20px;margin:0}
#tmrsec.mini #tn{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tmrsec.mini .row{margin:0}
#tmrsec.mini .btn{padding:4px 10px;font-size:13px}
.sh .btn{padding:4px 10px;font-size:13px}
.seg.sm .btn{padding:7px 4px;font-size:13px}
.dtag{margin-left:6px;font-size:11px;font-weight:600;color:var(--accent)}
.muted:empty{display:none}
.shr{display:flex;align-items:center;gap:6px}
#ppop{right:auto;width:300px;min-height:350px}
#ppop .sh{margin-bottom:4px}
.prow{position:relative;display:flex;align-items:center;gap:6px;margin-top:8px}
.prow input[type=text]{margin:0}
.pmain{flex:1;min-width:0;text-align:left;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:7px 10px;cursor:pointer;font:inherit}
.pmain strong{display:block;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pmain small{display:block;color:var(--mute);font-size:12px}
.pmenu{position:absolute;right:0;top:calc(100% + 4px);z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.3);min-width:150px}
.pmenu button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--ink);font:inherit;padding:7px 10px;border-radius:6px;cursor:pointer}
.pmenu button:hover{background:var(--bg)}
.pmenu .del{color:#E5384F}
.tdisp{font-size:34px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:2px 0 4px}
.pop input[type=file]{width:100%;margin-top:4px;font-size:12px;color:var(--ink)}
.hr.day{border-top:2px solid var(--mute)}.dayl{position:absolute;left:8px;top:4px;font-size:11px;color:var(--mute)}
.tk{position:absolute;left:-7px;width:7px;border-top:1px solid var(--mute);opacity:.7}
.now{position:absolute;left:-6px;right:0;border-top:2px solid var(--now);z-index:5;pointer-events:none}
.now::before{content:"";position:absolute;left:-1px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--now)}
.blk{position:absolute;left:6px;right:6px;border:0;border-left:5px solid var(--c);border-radius:6px;padding:4px 10px;overflow:hidden;background:color-mix(in srgb,var(--c) 26%,var(--panel));cursor:pointer;text-align:left;color:var(--ink);font:inherit;font-size:13px;line-height:1.25;z-index:2}
.blk[aria-pressed=true]{box-shadow:0 0 0 2px var(--ink)}
.blk strong{font-weight:600;font-size:14px}
.blk small{display:block;color:var(--mute);font-size:12px}
.blk.tight{display:flex;gap:10px;align-items:center;padding-top:0;padding-bottom:0}
.blk.tight small{display:inline}
.brk{position:absolute;left:6px;right:6px;border-radius:4px;background:repeating-linear-gradient(135deg,var(--hatch) 0 6px,transparent 6px 12px);color:var(--mute);font-size:11px;padding:0 10px;overflow:hidden;display:flex;align-items:center}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;z-index:60;max-width:90vw}
#toast[hidden]{display:none}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);width:min(440px,92vw)}
dialog textarea{width:100%;height:150px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:12px/1.4 ui-monospace,monospace;padding:8px}
@media(max-width:820px){body{height:auto;overflow:auto;grid-template-columns:1fr;grid-template-rows:auto auto auto}.top{grid-column:1;position:sticky;top:env(safe-area-inset-top,0px);z-index:30}.main{grid-column:1;grid-row:2;overflow:visible;padding:0 12px 24px}.hdr{top:calc(env(safe-area-inset-top,0px) + 56px)}.side{grid-column:1;grid-row:3;border-right:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<aside class="side">
<section>
<div class="sh"><h2>My window</h2><div class="shr"><button class="btn alt" id="bpre" aria-expanded="false">Presets</button><button class="ic" id="col" aria-label="Collapse sidebar" title="Collapse sidebar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button></div></div>
<label>Date<input type="date" id="date"></label>
<div class="grid2">
<label>Start<input type="time" id="start"></label>
<label>End<span id="nd"></span><input type="time" id="end"></label>
</div>
<label style="margin-top:10px">Work time<div id="wt" style="display:flex"></div></label>
<div class="grid2">
<label>Chunks<input type="number" id="n" min="0" max="12"></label>
<label>Break (min)<input type="number" id="brk" min="0" max="120"></label>
</div>
<div class="warn" id="warn" hidden></div>
</section>
<section>
<h2>Chunks</h2>
<p class="muted" id="chint" style="margin:0 0 12px">Select a block in the preview to edit it.</p>
<div id="editor"></div>
</section>
<section id="tmrsec">
<h2>Timer</h2>
<div class="muted" id="tn"></div>
<div class="tdisp" id="td"></div>
</section>
</aside>
<div class="right">
<header class="top">
<div class="tl"><button class="ic" id="exp2" aria-label="Show sidebar" title="Show sidebar" hidden><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button><h1>Timechunk</h1></div>
<nav>
<button class="btn alt" id="bset" aria-expanded="false">Settings</button>
</nav>
</header>
<div class="pop" id="pset" hidden>
<h2>Settings</h2>
<div class="row" style="margin:0 0 4px"><button class="btn alt" id="bimp" style="flex:1">Import</button><button class="btn" id="bexp" style="flex:1">Export</button></div>
<input type="file" id="impf" accept=".ics,.ical,text/calendar" hidden>
<label style="display:flex;gap:8px;align-items:center;color:var(--ink);margin-top:10px"><input type="checkbox" id="ib"> Include breaks as events</label>
<h3 style="margin-top:16px">Theme</h3>
<div class="seg" id="themes"></div>
<label style="margin-top:12px">Accent color</label>
<div class="sw" id="accents"></div>
<label style="margin-top:4px">Font<input type="text" id="fontin" placeholder="Font name or URL" autocomplete="off" spellcheck="false"></label>
<h3>On startup</h3>
<div class="seg sm" id="startm"></div>
<p class="muted" id="startnote" style="margin:6px 0 0"></p>
<h3>Timer</h3>
<label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="secs"> Show seconds</label>
<label style="margin:14px 0 6px">Bell sound</label>
<div class="seg" id="sndm"></div>
<div id="sndc" style="margin-top:10px"></div>
</div>
<div class="pop" id="ppop" hidden>
<div class="sh"><h2>Presets</h2><button class="btn alt" id="psave">Save current</button></div>
<div id="plist"></div>
</div>
<main class="main">
<div class="hdr"><h2 id="dlabel">Day preview</h2><span class="muted" id="sum"></span></div>
<div class="cal" id="cal"></div>
</main>
<div class="zoom"><button class="btn alt" id="zo" aria-label="Zoom out">−</button><span id="zl" title="Click to reset zoom">100%</span><button class="btn alt" id="zi" aria-label="Zoom in">+</button></div>
</div>
<div id="toast" hidden></div>
<dialog id="dlg"><p class="muted" id="dmsg" style="margin-top:0"></p><textarea id="fb" readonly></textarea><div class="row" style="justify-content:flex-end"><button class="btn" id="dx">Close</button></div></dialog>
<script>
(()=>{const u=navigator.userAgent;const f=/Android/i.test(u)?'Roboto':/iPhone|iPad|iPod|Macintosh|Mac OS/i.test(u)?'-apple-system,BlinkMacSystemFont,"SF Pro Text"':/Windows/i.test(u)?'"Segoe UI"':'Verdana';window.TCFONT=f+',"Segoe UI",Roboto,Verdana,sans-serif';document.documentElement.style.setProperty('--font',window.TCFONT)})();
const PRESETS=['#E5586E','#F2994A','#E0B400','#27AE87','#2D9CDB','#9B6BDF','#8A6D4B'];
const ACCENTS=['#4F7CFF','#27AE87','#E5586E','#F2994A','#9B6BDF','#E0B400'];
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
function el(t,a={},...c){const e=document.createElement(t);for(const k in a){if(k==='class')e.className=a[k];else if(k.startsWith('on'))e.addEventListener(k.slice(2),a[k]);else e.setAttribute(k,a[k])}c.flat().forEach(x=>e.append(x));return e}
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
// start = now, rounded up to the next 5 minutes (20:36 -> 20:40, 9:01 -> 9:05)
const nxt=new Date(Math.floor(Date.now()/300000)*300000+300000);
let S={date:ymd(nxt),start:pad(nxt.getHours())+':'+pad(nxt.getMinutes()),n:0,pendW:0,brk:10,L:50,ib:false,sel:0,theme:'system',accent:'#4F7CFF',zoom:1,col:false,font:'',startMode:'blank',defId:null,secs:true,snd:'default',sndSrc:'url',sndUrl:'',chunks:[]};
// only preferences are remembered; chunks and the window reset on refresh
try{const r=JSON.parse(localStorage.getItem('timechunk4'));if(r)Object.assign(S,{ib:!!r.ib,theme:r.theme||'system',accent:r.accent||S.accent,secs:r.secs!==false,snd:r.snd||'default',sndSrc:r.sndSrc||'url',sndUrl:r.sndUrl||'',font:r.font||'',startMode:r.startMode||'blank',defId:r.defId||null})}catch(e){}
function saveSession(){if(S.startMode!=='resume')return;try{localStorage.setItem('timechunk4session',JSON.stringify({date:S.date,start:S.start,n:S.n,pendW:S.pendW,brk:S.brk,L:S.L,chunks:S.chunks}))}catch(e){}}
const save=()=>{try{localStorage.setItem('timechunk4',JSON.stringify({ib:S.ib,theme:S.theme,accent:S.accent,secs:S.secs,snd:S.snd,sndSrc:S.sndSrc,sndUrl:S.sndUrl,font:S.font,startMode:S.startMode,defId:S.defId}))}catch(e){}saveSession()};
function sync(){while(S.chunks.length<S.n)S.chunks.push({name:'',color:null,len:null,todos:[]});if(S.sel>=S.n)S.sel=Math.max(0,S.n-1)}
const toMin=v=>{const[a,b]=(v||'0:0').split(':').map(Number);return a*60+b};
const hhmm=m=>pad(Math.floor(m/60)%24)+':'+pad(m%60);
const fmt=m=>{const h=Math.floor(m/60)%24,mm=m%60;return(h%12||12)+(mm?':'+pad(mm):'')+(h<12?' AM':' PM')};
const fmtL=m=>{const h=Math.floor(m/60)%24,mm=m%60;return(h%12||12)+':'+pad(mm)+(h<12?' AM':' PM')};
const dur=m=>{const r=Math.round(m);return r>=60?Math.floor(r/60)+' h'+(r%60?' '+r%60+' min':''):r+' min'};

// chunk lengths: a chunk with its own work time keeps it, the rest use the even split (S.L)
const lens=()=>{sync();const a=[];for(let i=0;i<S.n;i++)a.push(S.chunks[i].len||S.L);return a};
const gap=i=>i<S.n-1?(S.chunks[i].gap??S.brk):0;
const gapSum=()=>Array.from({length:S.n},(_,i)=>gap(i)).reduce((x,y)=>x+y,0);
const totalW=()=>S.n?lens().reduce((x,y)=>x+y,0)+gapSum():(S.pendW||0);
function solveL(W){if(S.n===0){S.pendW=W;return}let f=0,a=0;for(let i=0;i<S.n;i++){const c=S.chunks[i];if(c.len)f+=c.len;else a++}if(a)S.L=(W-gapSum()-f)/a}
function layout(){
  const L=lens(),s=toMin(S.start);
  if(L.some(x=>x<1))return{items:[],msg:'There isn’t enough time for every chunk. Use fewer chunks, shorter breaks or more work time.'};
  const items=[];let cur=s;
  L.forEach((len,i)=>{
    const b=gap(i);
    items.push({type:'chunk',i,s:Math.round(cur),e:Math.round(cur+len)});cur+=len;
    if(b>0){items.push({type:'break',s:Math.round(cur),e:Math.round(cur+b)})}
    cur+=b;
  });
  if(Math.round(cur-s)>1440)return{items:[],msg:'A window can be at most 24 hours.'};
  return{items,msg:''};
}

function renderCal(){
  updateTimer();
  const L=layout(),cal=$('#cal');cal.replaceChildren();
  $('#warn').hidden=!L.msg;$('#warn').textContent=L.msg;
  $('#sum').textContent=L.msg||!S.n?'':dur(totalW())+' total · '+S.n+' chunks · '+S.brk+' min breaks';
  const dl=new Date(S.date+'T00:00');$('#dlabel').textContent=isNaN(dl)?'Day preview':dl.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
  const s=toMin(S.start),e=Math.round(s+totalW());
  const gs=Math.max(0,Math.floor(s/60)*60-60),ge0=Math.ceil(Math.max(e,s+60)/60)*60+60;
  // the measure fills the window exactly and is cut off at the bottom; it only scrolls when the schedule itself is taller
  const ppm=84/60*S.zoom,mh=matchMedia('(max-width:820px)').matches?innerHeight*.8:$('.main').clientHeight,availPx=mh-$('.hdr').offsetHeight-56,H=Math.max((ge0-gs)*ppm,availPx),ge=gs+Math.floor(H/ppm/15)*15;
  cal.style.height=H+'px';
  for(let m=gs;m<=ge;m+=15){
    const y=(m-gs)*ppm;
    if(m%60===0){const dayb=m%1440===0&&m>gs,dd=new Date(S.date+'T00:00');dd.setDate(dd.getDate()+Math.floor(m/1440));cal.append(el('div',{class:'hr'+(dayb?' day':''),style:'top:'+y+'px'},el('b',{},fmt(m)),dayb?el('span',{class:'dayl'},dd.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})):''))}
    else if(m%30===0)cal.append(el('div',{class:'hf',style:'top:'+y+'px'},el('b',{},':30')));
    else cal.append(el('div',{class:'tk',style:'top:'+y+'px'}));
  }
  L.items.forEach(it=>{
    const top=(it.s-gs)*ppm,h=Math.max(8,(it.e-it.s)*ppm-2);
    if(it.type==='break'){cal.append(el('div',{class:'brk',style:`top:${top+1}px;height:${h}px`},h>14?'Break · '+(it.e-it.s)+' min':''));return}
    const c=S.chunks[it.i],done=c.todos.filter(t=>t.d).length,tight=h<50;

});
function applyPreset(p){
  S.n=p.n;S.brk=p.brk;S.L=p.L;S.pendW=0;S.sel=0;
  S.chunks=p.chunks.map(c=>({name:c.name,color:c.color,len:c.len,gap:c.gap,todos:c.todos.map(t=>({t:t.t,d:false}))}));
  $('#n').value=S.n;$('#brk').value=S.brk;
  closePre();renderAll();syncTimes();toast('Loaded '+p.name);
}
const closePre=()=>{$('#ppop').hidden=true;$('#bpre').setAttribute('aria-expanded','false');pMenu=null};
$('#bpre').addEventListener('click',e=>{
  e.stopPropagation();const open=$('#ppop').hidden;closeP();closePre();
  if(open){
    const r=e.currentTarget.getBoundingClientRect(),pp=$('#ppop');
    pp.hidden=false;pp.style.left=Math.max(12,Math.min(r.left,innerWidth-312))+'px';pp.style.top=(r.bottom+6)+'px';pp.style.maxHeight='calc(100vh - '+(r.bottom+18)+'px)';
    e.currentTarget.setAttribute('aria-expanded','true');renderPresets();
  }
});
$('#bset').addEventListener('click',closePre);
document.addEventListener('click',e=>{const q=e.composedPath();if(!q.includes($('#ppop'))&&!q.includes($('#bpre')))closePre()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePre()});
renderPresets();
// ---- startup mode, default preset, custom font ----
function loadPresetData(p){
  S.n=p.n;S.brk=p.brk;S.L=p.L;S.pendW=0;S.sel=0;
  S.chunks=p.chunks.map(c=>({name:c.name,color:c.color,len:c.len,gap:c.gap,todos:c.todos.map(t=>({t:t.t,d:false}))}));
}
function buildStart(){
  const m=$('#startm');m.replaceChildren();
  [['blank','Blank slate'],['resume','Resume'],['default','Default preset']].forEach(([k,l])=>m.append(el('button',{class:'btn alt','aria-pressed':String(S.startMode===k),onclick:()=>{S.startMode=k;save();if(k==='resume')saveSession();buildStart()}},l)));
  $('#startnote').textContent=S.startMode==='default'&&!P.some(p=>p.id===S.defId)?'No default preset yet. Set one from a preset’s ⋯ menu.':'';
}
function startup(){
  if(S.startMode==='resume'){
    try{const r=JSON.parse(localStorage.getItem('timechunk4session'));if(r&&r.chunks)Object.assign(S,{date:r.date||S.date,start:r.start||S.start,n:r.n||0,pendW:r.pendW||0,brk:r.brk??S.brk,L:r.L||S.L,chunks:r.chunks})}catch(e){}
  }else if(S.startMode==='default'){
    const p=P.find(x=>x.id===S.defId);if(p)loadPresetData(p);
  }
  $('#date').value=S.date;$('#start').value=S.start;$('#n').value=S.n;$('#brk').value=S.brk;
}
buildStart();startup();
addEventListener('pagehide',saveSession);
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveSession()});
function applyFont(){
  const r=document.documentElement,old=document.getElementById('tcfont');if(old)old.remove();
  const v=(S.font||'').trim();
  if(!v){r.style.setProperty('--font',window.TCFONT);return}
  let fam=v.replace(/["']/g,'');
  if(/^https?:\/\//i.test(v)){
    let u;try{u=new URL(v)}catch(e){toast('That doesn’t look like a valid URL.');r.style.setProperty('--font',window.TCFONT);return}
    if(/\.(woff2?|ttf|otf)$/i.test(u.pathname)){
      fam='TimechunkCustom';
      new FontFace(fam,'url("'+v+'")').load().then(f=>document.fonts.add(f)).catch(()=>toast('Couldn’t load that font file. It may be blocked in this viewer.'));
    }else{
      const q=u.searchParams.get('family');fam=q?q.split(':')[0].replace(/\+/g,' '):'';
      document.head.append(el('link',{id:'tcfont',rel:'stylesheet',href:v,onerror:()=>toast('Couldn’t load that font stylesheet. It may be blocked in this viewer.')}));
    }
  }else{
    document.head.append(el('link',{id:'tcfont',rel:'stylesheet',href:'https://fonts.googleapis.com/css2?family='+encodeURIComponent(fam).replace(/%20/g,'+')+'&display=swap'}));
  }
  r.style.setProperty('--font',(fam?'"'+fam+'",':'')+window.TCFONT);
}
$('#fontin').value=S.font;
$('#fontin').addEventListener('change',e=>{S.font=e.target.value.trim();save();applyFont()});
// collapsible sidebar; the timer pops out as a compact mini-window bottom left
const tsec=$('#tmrsec');
function setCol(c){
  S.col=c;save();document.body.classList.toggle('col',c);$('#exp2').hidden=!c;
  if(c){tsec.classList.add('mini');document.body.append(tsec)}else{tsec.classList.remove('mini');$('.side').append(tsec)}
  renderCal();
}
$('#col').addEventListener('click',()=>setCol(true));$('#exp2').addEventListener('click',()=>setCol(false));
setCol(S.col);
// zoom the day preview (buttons, or Ctrl/Cmd + scroll)
function setZoom(z){
  z=Math.min(4,Math.max(.4,Math.round(z*100)/100));if(z===S.zoom)return;
  const m=$('.main'),topMin=m.scrollTop/(84/60*S.zoom);
  S.zoom=z;$('#zl').textContent=Math.round(z*100)+'%';renderCal();m.scrollTop=topMin*84/60*z;
}
$('#zi').addEventListener('click',()=>setZoom(S.zoom*1.25));
$('#zo').addEventListener('click',()=>setZoom(S.zoom/1.25));
$('#zl').addEventListener('click',()=>setZoom(1));
$('.main').addEventListener('wheel',e=>{if(e.ctrlKey||e.metaKey){e.preventDefault();setZoom(S.zoom*(e.deltaY<0?1.1:1/1.1))}},{passive:false});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(S.theme==='system')applyTheme()});
buildSnd();
applyTheme();applyFont();sync();syncTimes();renderAll();
setInterval(renderCal,60000);addEventListener('resize',renderCal);
</script>
</body>
</html>
